<!-- Poster 6: Madras Cyber Matrix -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="bgCyber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bgCyber)" />

  <!-- Dravidian Gopuram Cyberpunk Neon Blueprint Silhouette -->
  <g transform="translate(150, 150)" stroke="#10B981" stroke-width="1.2" opacity="0.8">
    <!-- Tiered Temple Gopuram outline -->
    <polygon points="-60,110 60,110 50,60 -50,60" fill="none" />
    <polygon points="-50,60 50,60 40,15 -40,15" fill="none" />
    <polygon points="-40,15 40,15 30,-30 -30,-30" fill="none" />
    <polygon points="-30,-30 30,-30 18,-65 -18,-65" fill="none" />
    <polygon points="-18,-65 18,-65 5,-85 -5,-85" fill="none" />
    <!-- Kalasam Finials on top -->
    <circle cx="-12" cy="-90" r="3" fill="#00F0FF" />
    <circle cx="0" cy="-93" r="3.5" fill="#00F0FF" />
    <circle cx="12" cy="-90" r="3" fill="#00F0FF" />
    <!-- Cyber Circuits connecting -->
    <line x1="-120" y1="0" x2="-40" y2="15" stroke="#00F0FF" stroke-dasharray="4,4" />
    <line x1="120" y1="0" x2="40" y2="15" stroke="#00F0FF" stroke-dasharray="4,4" />
  </g>

  <!-- Binary Code / Data streams overlay -->
  <text x="35" y="70" fill="#059669" font-family="monospace" font-size="9" opacity="0.6">01101100 01101111</text>
  <text x="180" y="90" fill="#00F0FF" font-family="monospace" font-size="9" opacity="0.6">SYS_OVERRIDE_AUTH</text>

  <!-- Badge -->
  <rect x="15" y="15" width="50" height="20" rx="4" fill="#047857" />
  <text x="40" y="29" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">TAMIL</text>

  <!-- Title & Typography -->
  <text x="150" y="336" fill="url(#neonGreen)" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="900" letter-spacing="3" text-anchor="middle">MADRAS</text>
  <text x="150" y="362" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="5" text-anchor="middle">CYBER MATRIX</text>
  <line x1="50" y1="380" x2="250" y2="380" stroke="#00F0FF" stroke-width="1.2" opacity="0.6" />
  <text x="150" y="402" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">TAMIL • ACTION THRILLER</text>
  <text x="150" y="425" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">★ 8.9 HIGH OCTANE</text>
</svg>

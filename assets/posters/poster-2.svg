<!-- Poster 2: Gulaal Nights - Mumbai 1994 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="bgGulaal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E0B24" />
      <stop offset="45%" stop-color="#120517" />
      <stop offset="100%" stop-color="#050108" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bgGulaal)" />
  <circle cx="150" cy="140" r="100" fill="url(#lampGlow)" />

  <!-- Rain Lines & Noir Mood -->
  <g stroke="#F43F5E" stroke-width="0.8" opacity="0.3">
    <line x1="20" y1="20" x2="10" y2="180" /><line x1="80" y1="10" x2="70" y2="190" />
    <line x1="140" y1="30" x2="130" y2="210" /><line x1="220" y1="10" x2="210" y2="170" />
    <line x1="280" y1="25" x2="270" y2="200" />
  </g>

  <!-- Mumbai Marine Drive & Victorian Skyline Silhouette -->
  <path d="M 0 250 Q 80 230 150 240 Q 220 250 300 230 L 300 450 L 0 450 Z" fill="#0B040F" />
  <rect x="50" y="180" width="22" height="60" fill="#14061C" />
  <rect x="80" y="160" width="30" height="80" fill="#1A0924" />
  <polygon points="95,130 80,160 110,160" fill="#1A0924" />
  <rect x="180" y="170" width="25" height="70" fill="#14061C" />
  <rect x="220" y="190" width="35" height="50" fill="#14061C" />

  <!-- Revolver / Silhouette Motif -->
  <path d="M 120 120 L 170 120 L 170 135 L 155 135 L 145 165 L 130 160 L 138 135 L 120 135 Z" fill="#E2E8F0" opacity="0.9" filter="drop-shadow(0 0 10px #F43F5E)" />

  <!-- Red Gulaal Powder Cloud -->
  <circle cx="170" cy="115" r="28" fill="#F43F5E" opacity="0.4" filter="blur(6px)" />

  <!-- Certification Badge -->
  <rect x="15" y="15" width="45" height="20" rx="4" fill="#991B1B" />
  <text x="37" y="29" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">A 18+</text>

  <!-- Title & Typography -->
  <text x="150" y="325" fill="url(#neonPink)" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="900" letter-spacing="3" text-anchor="middle">GULAAL NIGHTS</text>
  <text x="150" y="352" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="5" text-anchor="middle">MUMBAI 1994</text>
  <line x1="60" y1="370" x2="240" y2="370" stroke="#E11D48" stroke-width="1.2" opacity="0.7" />
  <text x="150" y="394" fill="#A855F7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">HINDI • MARATHI • CRIME NOIR</text>
  <text x="150" y="420" fill="#F43F5E" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">★ 9.1 AUDIENCE CHOICE</text>
</svg>

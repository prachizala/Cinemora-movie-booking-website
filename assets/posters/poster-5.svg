<!-- Poster 5: Kaalchakra - The Quantum Paradox -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="bgQuantum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bgQuantum)" />

  <!-- Quantum Wormhole / Portal Rings -->
  <g transform="translate(150, 150)">
    <circle cx="0" cy="0" r="110" stroke="#0284C7" stroke-width="1.2" opacity="0.4" stroke-dasharray="10,6" />
    <circle cx="0" cy="0" r="90" stroke="#06B6D4" stroke-width="1.8" opacity="0.6" stroke-dasharray="14,4" />
    <circle cx="0" cy="0" r="70" stroke="#38BDF8" stroke-width="2.5" opacity="0.8" stroke-dasharray="8,6" />
    <circle cx="0" cy="0" r="48" stroke="#67E8F9" stroke-width="3" filter="drop-shadow(0 0 10px #06B6D4)" />
    <!-- Clock Hands spinning in reverse -->
    <line x1="0" y1="0" x2="-24" y2="-36" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="0" x2="35" y2="10" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Futuristic Sanskrit / Matrix Grid Lines -->
  <g stroke="#0891B2" stroke-width="0.7" opacity="0.3">
    <line x1="20" y1="0" x2="20" y2="450" /><line x1="60" y1="0" x2="60" y2="450" />
    <line x1="240" y1="0" x2="240" y2="450" /><line x1="280" y1="0" x2="280" y2="450" />
  </g>

  <!-- Silhouette of Scientist / Astronaut in Center -->
  <g transform="translate(150, 240) scale(0.85)" opacity="0.95">
    <circle cx="0" cy="-35" r="9" fill="#E0F2FE" />
    <path d="M -12 -22 L 12 -22 L 18 20 L -18 20 Z" fill="#38BDF8" />
  </g>

  <!-- Badge -->
  <rect x="15" y="15" width="60" height="20" rx="4" fill="#0284C7" />
  <text x="45" y="29" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">IMAX 4K</text>

  <!-- Title & Typography -->
  <text x="150" y="336" fill="url(#cyanNeon)" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="900" letter-spacing="3" text-anchor="middle">KAALCHAKRA</text>
  <text x="150" y="362" fill="#E0F2FE" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="4" text-anchor="middle">THE QUANTUM PARADOX</text>
  <line x1="50" y1="380" x2="250" y2="380" stroke="#06B6D4" stroke-width="1.2" opacity="0.6" />
  <text x="150" y="402" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">HINDI • ENGLISH • SCI-FI</text>
  <text x="150" y="425" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">★ 9.2 MIND-BENDING</text>
</svg>

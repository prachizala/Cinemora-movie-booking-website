<!-- Poster 12: Neon Horizon 2099 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="bgNeon2099" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F0C2E" />
      <stop offset="100%" stop-color="#05021A" />
    </linearGradient>
    <linearGradient id="cyberPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="cyberSun" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bgNeon2099)" />
  
  <!-- Retrowave Striped Cyber Sun -->
  <circle cx="150" cy="150" r="75" fill="url(#cyberSun)" />
  <line x1="80" y1="140" x2="220" y2="140" stroke="#05021A" stroke-width="3" />
  <line x1="85" y1="152" x2="215" y2="152" stroke="#05021A" stroke-width="4" />
  <line x1="95" y1="166" x2="205" y2="166" stroke="#05021A" stroke-width="5" />
  <line x1="110" y1="182" x2="190" y2="182" stroke="#05021A" stroke-width="6" />

  <!-- Neon Cyber Grid Ground Perspective -->
  <g stroke="#06B6D4" stroke-width="0.8" opacity="0.6">
    <line x1="150" y1="230" x2="-50" y2="450" /><line x1="150" y1="230" x2="50" y2="450" />
    <line x1="150" y1="230" x2="150" y2="450" />
    <line x1="150" y1="230" x2="250" y2="450" /><line x1="150" y1="230" x2="350" y2="450" />
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="250" x2="300" y2="250" /><line x1="0" y1="280" x2="300" y2="280" />
    <line x1="0" y1="320" x2="300" y2="320" />
  </g>

  <!-- Futuristic Spaceship Silhouette -->
  <polygon points="150,90 165,130 150,122 135,130" fill="#F8FAFC" filter="drop-shadow(0 0 10px #38BDF8)" />

  <!-- Badge -->
  <rect x="15" y="15" width="60" height="20" rx="4" fill="#7C3AED" />
  <text x="45" y="29" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">IMAX 3D</text>

  <!-- Title & Typography -->
  <text x="150" y="336" fill="url(#cyberPink)" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="900" letter-spacing="3" text-anchor="middle">NEON HORIZON</text>
  <text x="150" y="362" fill="#06B6D4" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" letter-spacing="7" text-anchor="middle">2099</text>
  <line x1="50" y1="380" x2="250" y2="380" stroke="#D946EF" stroke-width="1.2" opacity="0.6" />
  <text x="150" y="402" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">ENGLISH • SCI-FI ADVENTURE</text>
  <text x="150" y="425" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">★ 9.0 VISUAL MASTERPIECE</text>
</svg>

<!-- Poster 8: Malabar Monsoon Mirage -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="bgMalabar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#01140E" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bgMalabar)" />

  <!-- Misty Kerala Backwaters Moon & Palm Silhouette -->
  <circle cx="150" cy="130" r="60" fill="#ECFDF5" opacity="0.85" filter="drop-shadow(0 0 25px rgba(52,211,153,0.5))" />
  
  <!-- Slender Coconut Palms -->
  <path d="M 240 260 Q 210 180 200 80" stroke="#064E3B" stroke-width="4" fill="none" />
  <path d="M 200 80 Q 170 60 140 85" stroke="#047857" stroke-width="2.5" fill="none" />
  <path d="M 200 80 Q 230 60 260 85" stroke="#047857" stroke-width="2.5" fill="none" />
  <path d="M 200 80 Q 200 40 210 20" stroke="#047857" stroke-width="2.5" fill="none" />

  <!-- Traditional Snake Boat (Vallam Kali) prow in reflection -->
  <path d="M 40 260 Q 150 240 260 260 Q 275 220 280 180 Q 260 220 240 250 Z" fill="#022C22" />

  <!-- Water Ripple reflections -->
  <ellipse cx="150" cy="270" rx="100" ry="8" stroke="#34D399" stroke-width="1.2" opacity="0.5" />
  <ellipse cx="150" cy="290" rx="70" ry="6" stroke="#34D399" stroke-width="0.8" opacity="0.4" />

  <!-- Heavy Monsoon Rain streaks -->
  <g stroke="#A7F3D0" stroke-width="0.8" opacity="0.4">
    <line x1="30" y1="20" x2="10" y2="160" /><line x1="90" y1="40" x2="70" y2="180" />
    <line x1="170" y1="10" x2="150" y2="150" /><line x1="230" y1="30" x2="210" y2="170" />
  </g>

  <!-- Badge -->
  <rect x="15" y="15" width="60" height="20" rx="4" fill="#047857" />
  <text x="45" y="29" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">MALAYALAM</text>

  <!-- Title & Typography -->
  <text x="150" y="336" fill="url(#emeraldGrad)" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="900" letter-spacing="3" text-anchor="middle">MALABAR</text>
  <text x="150" y="362" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="5" text-anchor="middle">MONSOON MIRAGE</text>
  <line x1="50" y1="380" x2="250" y2="380" stroke="#10B981" stroke-width="1.2" opacity="0.6" />
  <text x="150" y="402" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">MALAYALAM • MYSTERY DRAMA</text>
  <text x="150" y="425" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">★ 9.5 NATIONAL AWARD WINNER</text>
</svg>

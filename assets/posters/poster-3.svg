<!-- Poster 3: Amdavad Junction -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="bgAmdavad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bgAmdavad)" />

  <!-- Heritage Gujarati Pol Window & Jharokha Arch -->
  <path d="M 60 40 L 240 40 C 240 40 240 180 150 180 C 60 180 60 40 60 40 Z" fill="#042F2E" stroke="url(#warmAmber)" stroke-width="2.5" />
  
  <!-- Intimate Jali Pattern Details -->
  <g stroke="#34D399" stroke-width="0.8" opacity="0.3">
    <circle cx="150" cy="110" r="45" />
    <circle cx="150" cy="110" r="30" />
    <line x1="105" y1="110" x2="195" y2="110" />
    <line x1="150" y1="65" x2="150" y2="155" />
  </g>

  <!-- Kite (Patang) Flying High (Ahmedabad Uttarayan Vibe) -->
  <polygon points="150,55 175,80 150,105 125,80" fill="#F43F5E" />
  <polygon points="150,105 158,118 142,118" fill="#FDE047" />
  <line x1="150" y1="80" x2="150" y2="105" stroke="#FFF" stroke-width="1" />
  <path d="M 150 118 Q 165 140 155 170" stroke="#FFF" stroke-width="0.8" opacity="0.7" fill="none" />

  <!-- Vintage Railway Signal Lamp -->
  <circle cx="70" cy="220" r="14" fill="#10B981" filter="drop-shadow(0 0 10px #10B981)" />
  <line x1="70" y1="220" x2="70" y2="300" stroke="#065F46" stroke-width="3" />

  <!-- Sabarmati Riverfront Waves Base -->
  <path d="M 0 280 Q 75 260 150 280 Q 225 300 300 280 L 300 450 L 0 450 Z" fill="#021C16" />

  <!-- Badge -->
  <rect x="15" y="15" width="40" height="20" rx="4" fill="#059669" />
  <text x="35" y="29" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">U</text>

  <!-- Title & Typography -->
  <text x="150" y="328" fill="url(#warmAmber)" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="900" letter-spacing="2" text-anchor="middle">AMDAVAD</text>
  <text x="150" y="356" fill="#FDE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="6" text-anchor="middle">JUNCTION</text>
  <line x1="60" y1="375" x2="240" y2="375" stroke="#10B981" stroke-width="1.2" opacity="0.6" />
  <text x="150" y="398" fill="#A7F3D0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">GUJARATI • FAMILY COMEDY</text>
  <text x="150" y="422" fill="#FDE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">★ 9.3 HEARTWARMING HIT</text>
</svg>

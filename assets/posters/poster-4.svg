<!-- Poster 4: Vayuputra - Son of the Wind -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="bgVayu" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="50%" stop-color="#431407" />
      <stop offset="100%" stop-color="#1A0602" />
    </linearGradient>
    <linearGradient id="orangeFire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <radialGradient id="celestialRays" cx="50%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#EA580C" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bgVayu)" />
  <circle cx="150" cy="145" r="95" fill="url(#celestialRays)" />

  <!-- Mythological Mace (Gada) Silhouette in Clouds -->
  <g transform="translate(150, 140) rotate(-18)">
    <circle cx="0" cy="-60" r="28" fill="#FDE047" stroke="#EA580C" stroke-width="2.5" filter="drop-shadow(0 0 15px #F97316)" />
    <!-- Fluted details on Gada head -->
    <path d="M -20 -60 Q 0 -45 20 -60" stroke="#78350F" stroke-width="2" fill="none" />
    <path d="M -15 -75 Q 0 -60 15 -75" stroke="#78350F" stroke-width="2" fill="none" />
    <rect x="-4" y="-32" width="8" height="95" rx="3" fill="#D97706" stroke="#451A03" />
    <polygon points="0,-95 -7,-80 7,-80" fill="#CA8A04" />
  </g>

  <!-- Mountain Peak (Gandhamadana) -->
  <polygon points="0,310 90,220 180,290 240,240 300,310 300,450 0,450" fill="#240A04" />

  <!-- Lightning arcs -->
  <path d="M 40 80 L 70 120 L 55 130 L 95 180" stroke="#FEF08A" stroke-width="2" filter="drop-shadow(0 0 8px #FDE047)" fill="none" />
  <path d="M 260 70 L 230 110 L 245 120 L 210 170" stroke="#FEF08A" stroke-width="2" filter="drop-shadow(0 0 8px #FDE047)" fill="none" />

  <!-- Badge -->
  <rect x="15" y="15" width="55" height="20" rx="4" fill="#EA580C" />
  <text x="42" y="29" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">U/A 13+</text>

  <!-- Title & Typography -->
  <text x="150" y="336" fill="url(#orangeFire)" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="900" letter-spacing="3" text-anchor="middle">VAYUPUTRA</text>
  <text x="150" y="362" fill="#FED7AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="5" text-anchor="middle">SON OF THE WIND</text>
  <line x1="50" y1="380" x2="250" y2="380" stroke="#F97316" stroke-width="1.2" opacity="0.6" />
  <text x="150" y="402" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">TELUGU • TAMIL • HINDI • 3D</text>
  <text x="150" y="425" fill="#FBBF24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">★ 9.6 BLOCKBUSTER OF THE YEAR</text>
</svg>

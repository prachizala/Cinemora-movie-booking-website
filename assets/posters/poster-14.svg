<!-- Poster 14: Shadows of Qutub -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="bgQutub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="bloodRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bgQutub)" />

  <!-- Full Blood Moon -->
  <circle cx="150" cy="130" r="70" fill="#7F1D1D" opacity="0.8" filter="blur(8px)" />
  <circle cx="150" cy="130" r="60" fill="#DC2626" opacity="0.6" />

  <!-- Qutub Minar Architectural Silhouette with Fluted Balconies -->
  <g transform="translate(150, 160)">
    <!-- Base tier -->
    <polygon points="-24,110 24,110 20,40 -20,40" fill="#1C1917" stroke="#78350F" stroke-width="1" />
    <!-- Balcony 1 -->
    <rect x="-26" y="36" width="52" height="6" fill="#44403C" />
    <!-- Tier 2 -->
    <polygon points="-19,36 19,36 15,-30 -15,-30" fill="#1C1917" stroke="#78350F" stroke-width="1" />
    <!-- Balcony 2 -->
    <rect x="-20" y="-34" width="40" height="5" fill="#44403C" />
    <!-- Tier 3 -->
    <polygon points="-14,-34 14,-34 10,-90 -10,-90" fill="#1C1917" stroke="#78350F" stroke-width="1" />
    <!-- Top Cupola / Spire -->
    <polygon points="-7,-90 7,-90 0,-105" fill="#B91C1C" />
  </g>

  <!-- Ravens / Bats swirling in nocturnal sky -->
  <path d="M 60 70 Q 70 60 80 70 Q 75 80 60 70" fill="#E2E8F0" opacity="0.7" />
  <path d="M 220 85 Q 230 75 240 85 Q 235 95 220 85" fill="#E2E8F0" opacity="0.7" />
  <path d="M 200 50 Q 210 40 220 50" fill="#E2E8F0" opacity="0.6" />

  <!-- Mist / Fog base -->
  <path d="M 0 280 Q 75 260 150 280 Q 225 300 300 280 L 300 450 L 0 450 Z" fill="#09090B" />

  <!-- Badge -->
  <rect x="15" y="15" width="55" height="20" rx="4" fill="#991B1B" />
  <text x="42" y="29" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">U/A 16+</text>

  <!-- Title & Typography -->
  <text x="150" y="336" fill="url(#bloodRed)" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="900" letter-spacing="3" text-anchor="middle">SHADOWS OF</text>
  <text x="150" y="362" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" letter-spacing="6" text-anchor="middle">QUTUB</text>
  <line x1="50" y1="380" x2="250" y2="380" stroke="#DC2626" stroke-width="1.2" opacity="0.6" />
  <text x="150" y="402" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">URDU • HINDI • SUPERNATURAL NOIR</text>
  <text x="150" y="425" fill="#EF4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">★ 8.8 SPINE-CHILLING</text>
</svg>

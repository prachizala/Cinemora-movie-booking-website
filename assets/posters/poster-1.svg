<!-- Poster 1: Ashoka - The Iron Emperor -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="bgAshoka" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="40%" stop-color="#1C0A00" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <radialGradient id="fireSun" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="60%" stop-color="#9A3412" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bgAshoka)" />
  <circle cx="150" cy="160" r="110" fill="url(#fireSun)" />
  
  <!-- Ashoka Chakra Wheels & Spikes -->
  <circle cx="150" cy="160" r="80" stroke="#FBBF24" stroke-width="2" opacity="0.3" stroke-dasharray="6,4" />
  <circle cx="150" cy="160" r="45" stroke="#F59E0B" stroke-width="1.5" opacity="0.4" />
  
  <!-- Majestic Sword & Warrior Silhouette -->
  <polygon points="150,50 156,220 150,230 144,220" fill="#E2E8F0" />
  <line x1="130" y1="210" x2="170" y2="210" stroke="url(#goldText)" stroke-width="5" stroke-linecap="round" />
  <rect x="146" y="212" width="8" height="25" rx="3" fill="#78350F" />
  <!-- Mountain & Army Ridge Silhouette -->
  <polygon points="0,290 80,240 160,270 230,235 300,280 300,450 0,450" fill="#0F0501" />

  <!-- Embers / Sparks -->
  <circle cx="70" cy="140" r="2" fill="#FDE047" />
  <circle cx="230" cy="120" r="1.5" fill="#F97316" />
  <circle cx="190" cy="90" r="2.5" fill="#FBBF24" />
  <circle cx="110" cy="180" r="1.5" fill="#FDE047" />

  <!-- Badge -->
  <rect x="15" y="15" width="60" height="20" rx="4" fill="#B91C1C" />
  <text x="45" y="29" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">IMAX 3D</text>

  <!-- Title & Typography -->
  <text x="150" y="340" fill="url(#goldText)" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="900" letter-spacing="4" text-anchor="middle">ASHOKA</text>
  <text x="150" y="365" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="5" text-anchor="middle">THE IRON EMPEROR</text>
  <line x1="60" y1="380" x2="240" y2="380" stroke="#CA8A04" stroke-width="1" opacity="0.6" />
  <text x="150" y="402" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" letter-spacing="2" text-anchor="middle">HINDI • TELUGU • TAMIL</text>
  <text x="150" y="425" fill="#FBBF24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">★ 9.4 CRITIC CHOICE</text>
</svg>

<!-- Royal Cinema Duo Combo SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 80" fill="none">
  <defs>
    <linearGradient id="comboGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <!-- Soda behind -->
  <polygon points="50,22 76,22 72,66 54,66" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
  <line x1="62" y1="6" x2="62" y2="22" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" />
  <line x1="62" y1="6" x2="70" y2="4" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" />
  <!-- Popcorn in front -->
  <polygon points="14,32 48,32 44,70 18,70" fill="#991B1B" stroke="url(#comboGold)" stroke-width="1.3" />
  <polygon points="21,32 26,32 24,70 19,70" fill="#FFFFFF" opacity="0.8" />
  <polygon points="36,32 41,32 39,70 34,70" fill="#FFFFFF" opacity="0.8" />
  <!-- Popcorn kernels -->
  <circle cx="22" cy="24" r="5" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.7" />
  <circle cx="31" cy="20" r="7" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.7" />
  <circle cx="41" cy="23" r="5.5" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.7" />
  <circle cx="26" cy="28" r="5" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.7" />
  <circle cx="37" cy="27" r="5.5" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.7" />
  <!-- VIP Star Badge -->
  <polygon points="31,46 33,52 39,52 34,56 36,62 31,58 26,62 28,56 23,52 29,52" fill="url(#comboGold)" />
</svg>

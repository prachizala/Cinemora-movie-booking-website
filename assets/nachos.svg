<!-- Loaded Cheesy Nachos SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="nachoTray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="tortilla" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Tray Base -->
  <rect x="12" y="44" width="56" height="24" rx="6" fill="url(#nachoTray)" stroke="#64748B" stroke-width="1.5" />
  
  <!-- Tortilla Chips (Triangles) -->
  <polygon points="20,44 32,24 40,44" fill="url(#tortilla)" stroke="#A16207" stroke-width="1" />
  <polygon points="42,44 54,20 62,44" fill="url(#tortilla)" stroke="#A16207" stroke-width="1" />
  <polygon points="30,46 45,26 56,46" fill="url(#tortilla)" stroke="#B45309" stroke-width="1" />

  <!-- Nacho Cheese Drizzle -->
  <path d="M 24 38 Q 32 46 42 36 Q 50 48 58 40" stroke="url(#cheese)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <!-- Jalapeño Slice -->
  <circle cx="34" cy="40" r="3" fill="#15803D" stroke="#86EFAC" stroke-width="1" />
  <circle cx="48" cy="42" r="3" fill="#15803D" stroke="#86EFAC" stroke-width="1" />
  <!-- Salsa Cup -->
  <rect x="52" y="52" width="12" height="12" rx="3" fill="#DC2626" stroke="#FEF2F2" stroke-width="0.8" />
  <ellipse cx="58" cy="54" rx="4.5" ry="2" fill="#991B1B" />
</svg>

<!-- Premium Cinema Seat -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 44" fill="none">
  <defs>
    <linearGradient id="premGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#224268" />
      <stop offset="100%" stop-color="#102038" />
    </linearGradient>
    <linearGradient id="premCushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5A8E" />
      <stop offset="100%" stop-color="#173152" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Headrest & Upper Backrest -->
  <rect x="8" y="3" width="30" height="20" rx="6" fill="url(#premGrad)" stroke="#38BDF8" stroke-width="1.3" />
  
  <!-- Premium Stitching Lines -->
  <path d="M 14 6 Q 23 9 32 6" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" fill="none" />
  <path d="M 13 12 Q 23 15 33 12" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" fill="none" />
  <path d="M 14 18 Q 23 21 32 18" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" fill="none" />

  <!-- Seat Base / Bottom Cushion -->
  <path d="M 8 23 L 38 23 C 40.5 23 42 24.5 41.5 27 L 40 34 C 39.5 36.5 37 38 34 38 L 12 38 C 9 38 6.5 36.5 6 34 L 4.5 27 C 4 24.5 5.5 23 8 23 Z" fill="url(#premCushion)" stroke="#38BDF8" stroke-width="1.3" />
  <ellipse cx="23" cy="30" rx="10" ry="4" fill="#1C3D66" opacity="0.7" />

  <!-- Ergonomic Left Armrest with Cupholder -->
  <rect x="2" y="12" width="5.5" height="22" rx="2.5" fill="#101F33" stroke="#2563EB" stroke-width="1" />
  <circle cx="4.7" cy="16" r="1.6" fill="#38BDF8" opacity="0.8" />

  <!-- Ergonomic Right Armrest with Cupholder -->
  <rect x="38.5" y="12" width="5.5" height="22" rx="2.5" fill="#101F33" stroke="#2563EB" stroke-width="1" />
  <circle cx="41.3" cy="16" r="1.6" fill="#38BDF8" opacity="0.8" />
</svg>

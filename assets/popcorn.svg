<!-- Gourmet Caramel Popcorn SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="tubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="popCorn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>
  <!-- Tub Body -->
  <polygon points="20,32 60,32 54,74 26,74" fill="url(#tubGrad)" stroke="#FFD700" stroke-width="1.5" />
  <!-- Tub Stripes -->
  <polygon points="28,32 34,32 32,74 27,74" fill="#FFFFFF" opacity="0.9" />
  <polygon points="46,32 52,32 48,74 43,74" fill="#FFFFFF" opacity="0.9" />
  <rect x="36" y="44" width="8" height="18" rx="2" fill="#1C1917" />
  <text x="40" y="56" font-family="serif" font-size="8" fill="#FDE047" text-anchor="middle" font-weight="bold">C</text>
  
  <!-- Popcorn Kernels / Cloud -->
  <circle cx="28" cy="24" r="7" fill="url(#popCorn)" stroke="#A16207" stroke-width="0.8" />
  <circle cx="40" cy="20" r="9" fill="url(#popCorn)" stroke="#A16207" stroke-width="0.8" />
  <circle cx="52" cy="23" r="7.5" fill="url(#popCorn)" stroke="#A16207" stroke-width="0.8" />
  <circle cx="34" cy="28" r="6.5" fill="url(#popCorn)" stroke="#A16207" stroke-width="0.8" />
  <circle cx="47" cy="27" r="7" fill="url(#popCorn)" stroke="#A16207" stroke-width="0.8" />
  <circle cx="21" cy="30" r="5" fill="url(#popCorn)" stroke="#A16207" stroke-width="0.8" />
  <circle cx="59" cy="29" r="5.5" fill="url(#popCorn)" stroke="#A16207" stroke-width="0.8" />
</svg>

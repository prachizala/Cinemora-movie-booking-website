<!-- Luxury Double Couple Sofa (2-Person Unit) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 48" fill="none">
  <defs>
    <linearGradient id="sofaVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="40%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>
    <linearGradient id="sofaCushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="70%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#581010" />
    </linearGradient>
    <linearGradient id="sofaGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Left Seat Backrest -->
  <rect x="10" y="4" width="34" height="20" rx="5" fill="url(#sofaVelvet)" stroke="url(#sofaGold)" stroke-width="1.3" />
  <!-- Left Backrest Pillow Stitching -->
  <line x1="20" y1="8" x2="20" y2="20" stroke="#F87171" stroke-width="0.8" opacity="0.6" />
  <line x1="27" y1="8" x2="27" y2="20" stroke="#F87171" stroke-width="0.8" opacity="0.6" />
  <line x1="34" y1="8" x2="34" y2="20" stroke="#F87171" stroke-width="0.8" opacity="0.6" />

  <!-- Right Seat Backrest -->
  <rect x="50" y="4" width="34" height="20" rx="5" fill="url(#sofaVelvet)" stroke="url(#sofaGold)" stroke-width="1.3" />
  <!-- Right Backrest Pillow Stitching -->
  <line x1="60" y1="8" x2="60" y2="20" stroke="#F87171" stroke-width="0.8" opacity="0.6" />
  <line x1="67" y1="8" x2="67" y2="20" stroke="#F87171" stroke-width="0.8" opacity="0.6" />
  <line x1="74" y1="8" x2="74" y2="20" stroke="#F87171" stroke-width="0.8" opacity="0.6" />

  <!-- Left Bottom Cushion -->
  <rect x="9" y="24" width="35" height="17" rx="4" fill="url(#sofaCushion)" stroke="#EF4444" stroke-width="1.2" />
  <ellipse cx="26.5" cy="32" rx="11" ry="5" fill="#7F1D1D" opacity="0.7" />

  <!-- Right Bottom Cushion -->
  <rect x="50" y="24" width="35" height="17" rx="4" fill="url(#sofaCushion)" stroke="#EF4444" stroke-width="1.2" />
  <ellipse cx="67.5" cy="32" rx="11" ry="5" fill="#7F1D1D" opacity="0.7" />

  <!-- Outer Left Armrest -->
  <rect x="3" y="10" width="6" height="29" rx="3" fill="#380909" stroke="url(#sofaGold)" stroke-width="1.2" />

  <!-- Outer Right Armrest -->
  <rect x="85" y="10" width="6" height="29" rx="3" fill="#380909" stroke="url(#sofaGold)" stroke-width="1.2" />

  <!-- Shared Center Armrest / Gourmet Console -->
  <rect x="42.5" y="14" width="9" height="25" rx="3" fill="#260505" stroke="url(#sofaGold)" stroke-width="1" />
  <!-- Dual Center Cupholders -->
  <circle cx="47" cy="20" r="2.2" fill="#D97706" />
  <circle cx="47" cy="20" r="1.4" fill="#180202" />
  <circle cx="47" cy="29" r="2.2" fill="#D97706" />
  <circle cx="47" cy="29" r="1.4" fill="#180202" />

  <!-- Sweet Couple Indicator Badge (Center top) -->
  <path d="M 47 6.5 C 47 4 44 3 43 5 C 42 3 39 4 39 6.5 C 39 9 43 11 43 11 C 43 11 47 9 47 6.5 Z" transform="translate(4, -1) scale(0.65)" fill="url(#sofaGold)" />
</svg>
